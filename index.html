<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>História da vida trsite da Layne</title>
<style>
:root{--bg:#fff3ef;--ink:#3a1620;--card:#fff;--acc:#b3263e;--line:#f0cfd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0e13;--ink:#fbe9ec;--card:#2a1720;--acc:#ff7a90;--line:#4a2a35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0e13;--ink:#fbe9ec;--card:#2a1720;--acc:#ff7a90;--line:#4a2a35;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:manipulation}
#wrap{max-width:560px;margin:0 auto;padding:10px;position:relative}
canvas#g{width:100%;display:block;image-rendering:pixelated;border:3px solid var(--ink);border-radius:8px;background:#000}
.ctl{display:flex;gap:8px;margin-top:10px;user-select:none;-webkit-user-select:none}
.ctl button,.b{font:inherit;font-weight:800;border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:14px 0;flex:1;font-size:1.3rem;touch-action:none}
.ctl button:active,.b:active{background:var(--acc);color:#fff}
.b{width:100%;touch-action:manipulation;font-size:1rem;padding:12px;margin-top:10px}
.ov{position:absolute;inset:10px;background:color-mix(in srgb,var(--bg) 93%,transparent);display:flex;align-items:center;justify-content:center;padding:14px;border-radius:8px;text-align:center}
.box{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:16px;width:100%}
h1{font-size:1.4rem;color:var(--acc);margin:.2em 0}
input{font:inherit;width:100%;padding:12px;border:3px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.hide{display:none}
canvas#pt{image-rendering:pixelated;width:80px;height:112px}
.sp{display:flex;gap:12px;align-items:center;text-align:left}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g" width="320" height="180"></canvas>
<div class="ctl"><button id="L">◀</button><button id="R">▶</button><button id="J" style="flex:1.4">PULAR</button></div>
<div class="ov hide" id="dl"><div class="box"><div class="sp"><canvas id="pt" width="10" height="14"></canvas><div><b id="who"></b><p id="tx" style="margin:.4em 0"></p></div></div><button class="b" id="nx">Próximo</button></div></div>
</div>
<script>
var P={h:'#1a1420',s:'#f3cfb0',w:'#fff',e:'#111',r:'#d0283f',b:'#3b3f6b',k:'#5a3a2a',y:'#f5c542',p:'#ff8fb1',t:'#2fb5a3',g:'#9a9aa8',d:'#7a1f2b',o:'#e08a3c',m:'#6a4bc4',n:'#c9a27a',q:'#3d9a3d',G:'#0d0d12',R:'#b01826',K:'#23232f'};
var PL=["...hhhhhh...","..hhhhhhhh..",".hhhhhhhhhh.",".hhsssssshh.",".hhGeGGeGhh.",".hhsssssshh.",".hhsssssshh.",".hhRRYRRRRhh",".hKKKRYKKKKh","hhKKKRYKKKhn","hKKKKRRKKKKs",".KKKKKKKKKK.",".KKKKKKKKKK.",".KKKKKKKKKK.","..kk....kk.."];
var PL2=PL.slice(0,14).concat(["...kk..kk..."]);
var NP=["..hhhhhh..",".hhhhhhhh.",".hssssssh.",".hsessesh.",".hssssssh.","...ssss...","..cccccc..",".cccaaccc.","scccaacccs",".cccaaccc.",".cccccccc.","..cc..cc..","..cc..cc..","..kk..kk.."];
var IT={heart:[".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."],book:["mmmmmmw","mmpmpmw","mmppmmw","mmmmmmw","mmmmmmw"],flute:["......t","....tt.","...tt..","..tt...",".tt....","tt....."],cuscuz:[".w.w.w.","yyyyyyy","yoyoyoy","yyyyyyy",".yyyyy."],tea:["wwwwww.","wwwwwww","wwwwww.",".wwww..","ggggggg"],laranja:["...qq..",".ooooo.","oooyooo","ooooooo","ooooooo",".ooooo.","..ooo.."],ribbon:["r.....r","rr...rr",".rr.rr.","..rrr..","..r.r..",".rr.rr."]};
var CH=[
{n:"Lan Wangji",h:"#1a1420",c:"#f4f4fa",a:"#9fc3e8",t:"嗯。香蕉在月亮上睡觉，椅子非常生气。"},
{n:"Wei Wuxian",h:"#1a1420",c:"#2b2b33",a:"#d0283f",t:"哈哈！我的鞋子会唱歌，云今天吃了三碗米饭！"},
{n:"Hua Cheng",h:"#1a1420",c:"#b3263e",a:"#1a1420",t:"本座的蝴蝶昨天去银行借了一只鸭子。"},
{n:"Dr. Hannibal Lecter",h:"#b08a5a",c:"#2a2a33",a:"#7a1f2b",t:"Doutora Layne, macarao.con.salxixa"},
{n:"Mo Guan Shan",h:"#1a1420",c:"#8a8a99",a:"#e08a3c",t:"啧。你的西瓜为什么在跳舞？我不认识这只鸭子。"},
{n:"He Tian",h:"#1a1420",c:"#22243a",a:"#f5c542",t:"小矮子，冰箱里的雨伞今天去月球开会了。"}];
var W=3000,Z=750,NAME="Layne";
var SKY=['#f7b35c','#bfe6e0','#a9c8ef','#241a3a'],GR=['#d9a05b','#9fb3b8','#6a8f5a','#3a3050'],ZN=["Sertão do Nordeste","Hospital falido da Layne","Recesso das Nuvens","Baltimore"];
var GRD=[[0,480],[520,420],[980,460],[1480,500],[2020,500],[2560,440]];
var PF=[[200,115,50],[280,95,50],[600,112,60],[720,90,50],[1060,115,60],[1150,92,60],[1560,110,60],[1650,88,50],[2100,112,60],[2190,90,60],[2650,112,60]];
var SOL=PF.concat(GRD.map(function(g){return [g[0],150,g[1]]}));
var ITM=[[220,105,'heart'],[300,85,'book'],[430,138,'cuscuz'],[620,102,'flute'],[740,80,'tea'],[880,138,'ribbon'],[1080,105,'heart'],[1170,82,'book'],[1350,138,'cuscuz'],[1580,100,'flute'],[1670,78,'tea'],[1850,138,'ribbon'],[2120,102,'heart'],[2210,80,'book'],[2400,138,'cuscuz'],[2670,102,'flute'],[2780,138,'tea'],[150,138,'laranja'],[700,138,'laranja'],[1250,138,'laranja'],[2300,138,'laranja']].map(function(a){return{x:a[0],y:a[1],t:a[2],g:0}});
var cv=document.getElementById("g"),c=cv.getContext("2d");c.imageSmoothingEnabled=false;
var pl,cam,got,key={},ended,fr=0,toast="",tt=0;var DM=["Causa da morte: fumou laranja demais","Óbito por falta de estudo de anatomia","Hospital falido: sem leito pra você","Corinthians venceu. Você caiu","Fumar laranja não protege de buracos"];
function spr(x,m,pal,px,py,s,flip,w){
 w=m[0].length;
 for(var j=0;j<m.length;j++)for(var i=0;i<w;i++){var ch=m[j][flip?w-1-i:i];if(ch=='.')continue;x.fillStyle=pal[ch]||P[ch];x.fillRect(Math.round(px+i*s),Math.round(py+j*s),s,s)}
}
function reset(){pl={x:20,y:100,vx:0,vy:0,on:0,f:0};cam=0;got=0;ended=false;ITM.forEach(function(i){i.g=0})}
function respawn(){toast=DM[Math.floor(Math.random()*DM.length)];tt=150;pl.x=Math.floor(pl.x/Z)*Z+20;pl.y=100;pl.vy=0;pl.vx=0}
function upd(){
 var ax=(key.R?1:0)-(key.L?1:0);pl.vx=ax*1.9;if(ax)pl.f=ax;
 if(key.J&&pl.on){pl.vy=-6.6;pl.on=0}
 var py=pl.y+30;pl.vy+=.35;pl.x=Math.max(0,Math.min(W-24,pl.x+pl.vx));pl.y+=pl.vy;pl.on=0;
 if(pl.vy>=0)SOL.forEach(function(s){var b=pl.y+30;if(py<=s[1]+1&&b>=s[1]&&pl.x+20>s[0]&&pl.x+4<s[0]+s[2]){pl.y=s[1]-30;pl.vy=0;pl.on=1}});
 if(pl.y>200)respawn();
 ITM.forEach(function(i){if(!i.g&&Math.abs(pl.x+12-i.x-3)<12&&Math.abs(pl.y+15-i.y-3)<16){i.g=1;got++;if(i.t=='laranja'){toast='Você fumou uma laranja.';tt=120}}});
 cam=Math.max(0,Math.min(W-320,pl.x-130));
 if(pl.x>2890&&!ended){ended=true;finale()}
}
function draw(){
 var z=Math.min(3,Math.floor((cam+160)/Z));
 c.fillStyle=SKY[z];c.fillRect(0,0,320,180);
 var o=-cam;
 if(z==0){c.fillStyle='#ffe08a';c.fillRect(250,20,26,26);for(var i=0;i<6;i++){c.fillStyle='#3d8a4a';var x=60+i*130+o;c.fillRect(x,126,6,24);c.fillRect(x-5,134,5,4);c.fillRect(x+6,130,5,4)}}
 if(z==1){for(var i=0;i<5;i++){var x=800+i*140+o;c.fillStyle='#fff';c.fillRect(x,60,24,40);c.fillStyle='#d0283f';c.fillRect(x+9,66,6,28);c.fillRect(x+3,77,18,6)}}
 if(z==2){c.fillStyle='#8fb0d8';for(var i=0;i<6;i++){var x=1500+i*130+o;c.beginPath();c.moveTo(x,150);c.lineTo(x+60,50+(i%2)*20);c.lineTo(x+120,150);c.fill()}c.fillStyle='#b3263e';c.fillRect(1950+o,110,30,40);c.fillRect(1944+o,104,42,8)}
 if(z==3){c.fillStyle='#f0e6a8';c.fillRect(260,22,18,18);c.fillStyle='#120c20';for(var i=0;i<8;i++){c.fillRect(2250+i*95+o,70+(i%3)*14,40,90)}}
 for(var k=0;k<GRD.length;k++){var g=GRD[k],gz=Math.min(3,Math.floor(g[0]/Z));c.fillStyle=GR[Math.min(3,Math.floor((g[0]+g[1]/2)/Z))];c.fillRect(g[0]+o,150,g[1],30);c.fillStyle='rgba(0,0,0,.2)';c.fillRect(g[0]+o,150,g[1],3)}
 PF.forEach(function(p){c.fillStyle='#7a4a2a';c.fillRect(p[0]+o,p[1],p[2],6);c.fillStyle='#a8703f';c.fillRect(p[0]+o,p[1],p[2],2)});
 c.fillStyle='#fff';c.fillRect(2900+o,100,24,50);c.fillStyle='#b3263e';c.fillRect(2904+o,106,16,44);c.fillStyle='#f5c542';c.fillRect(2916+o,128,2,2);
 ITM.forEach(function(i){if(!i.g)spr(c,IT[i.t],P,i.x+o,i.y+Math.round(Math.sin(fr/12+i.x)*1.5),1)});
 var m=(pl.on&&(key.L||key.R)&&Math.floor(fr/6)%2)?PL2:PL;
 spr(c,m,P,pl.x+o,pl.y,2,pl.f<0);c.font='bold 8px monospace';c.lineWidth=2;c.strokeStyle='#000';c.fillStyle='#ffe14d';c.strokeText('LAYNE ▼',pl.x+o-6,pl.y-4);c.fillText('LAYNE ▼',pl.x+o-6,pl.y-4);
 c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,320,12);c.fillStyle='#fff';c.font='bold 8px monospace';
 c.fillText(ZN[z]+'   ★ '+got+'/'+ITM.length,4,9);if(bg.paused)c.fillText('♪ toque p/ som',226,9);if(tt>0){tt--;c.fillStyle='rgba(0,0,0,.7)';c.fillRect(30,160,260,14);c.fillStyle='#ffb347';c.fillText(toast,36,170)}
}
function loop(){fr++;if(!ended)upd();draw();requestAnimationFrame(loop)}
var di=0,pt=document.getElementById("pt").getContext("2d");
function finale(){di=0;document.getElementById("dl").classList.remove("hide");say()}
function say(){
 if(di>=CH.length){
  pt.clearRect(0,0,10,14);document.getElementById("who").textContent="PABÉMS PASOU!";
  document.getElementById("tx").textContent="(INSERIR O NOME DA PEÇONHA) PAREBÉNS PELOS (INSERIR IDADE) ANOS DE IDADE. QUE DEUS TE ELIMINE E TE FAÇA CRESCER. AGORA SÉRIO, ESPERO MUITO QUE VOCÊ FIQUE MENOS IDIOTA DO QUE VOCÊ É E SEJA MUITO FELIZ NO QUE VOCÊ QUISER FAZER. CCOMO VOCÊ JÁ SABE QUE NÃO TE CONHEÇO, NÃO TEM NADA PRA TE DESEJAR DE BOM, SO FELICIDADES FALSAS E CÍNICAS MESMO 🤘🤘🤘🤘🤘";
  document.getElementById("nx").style.display="none";return}
 var h=CH[di];pt.clearRect(0,0,10,14);spr(pt,NP,{h:h.h,c:h.c,a:h.a,s:'#f3cfb0',e:'#111',k:'#222'},0,0,1);
 document.getElementById("who").textContent=h.n;
 document.getElementById("tx").textContent=h.t.replace(/\{N\}/g,NAME);
 document.getElementById("nx").textContent="Próximo";
}
document.getElementById("nx").onclick=function(){
 if(di>=CH.length)return;
 di++;say()};
var bg=new Audio("hino-corinthians.m4a");bg.loop=true;
function tocar(){if(bg.paused)bg.play().catch(function(){})}
tocar();
["pointerup","touchend","click","keydown"].forEach(function(ev){addEventListener(ev,tocar)});
var map={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'J',w:'J',' ':'J'};
addEventListener("keydown",function(e){if(map[e.key]){key[map[e.key]]=1;e.preventDefault()}});
addEventListener("keyup",function(e){if(map[e.key])key[map[e.key]]=0});
['L','R','J'].forEach(function(k){var b=document.getElementById(k);
 b.addEventListener("pointerdown",function(e){e.preventDefault();key[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){key[k]=0})})});
reset();loop();
</script>
</body>
</html>
